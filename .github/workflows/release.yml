name: Yig'ish va chiqarish

# "v1.0.0" kabi teg yuborilganda Linux, Windows, macOS va Android uchun tayyor fayllar yig'iladi
# va GitHub Releases sahifasiga joylanadi. Qo'lda ishga tushirish ham mumkin (Actions → Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Kompyuter (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, script: dist:linux }
          - { name: Windows, os: windows-latest, script: dist:win }
          - { name: macOS, os: macos-latest, script: dist:mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Imzo kaliti (ixtiyoriy, GitHub Secrets'dan)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/isloh.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/isloh.jks" >> "$GITHUB_ENV"
            echo "Doimiy kalit bilan imzolanadi"
          else
            echo "ANDROID_KEYSTORE_BASE64 berilmagan — vaqtinchalik (debug) kalit bilan imzolanadi"
          fi
      - name: APK yig'ish
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/Isloh-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: dist/Isloh-Android.apk

  release:
    name: Release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: Isloh ${{ github.ref_name }}
          files: out/*
          body: |
            ## Isloh ${{ github.ref_name }} — yuklab olish

            | Tizim | Fayl |
            |---|---|
            | Windows 10/11 | **Isloh-Windows-Setup.exe** |
            | macOS (Apple Silicon M1–M4) | **Isloh-macOS-arm64.dmg** |
            | macOS (Intel) | **Isloh-macOS-x64.dmg** |
            | Ubuntu / Debian / Linux Mint | **Isloh-Linux.deb** |
            | Boshqa Linux | **Isloh-Linux.AppImage** |
            | Android 7+ | **Isloh-Android.apk** |

            O'rnatish bo'yicha batafsil yo'riqnoma: [README](https://github.com/${{ github.repository }}#readme)
