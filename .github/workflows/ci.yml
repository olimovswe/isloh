name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Sinov (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Sintaksis tekshiruvi
        run: for f in core/*.js ui/*.js desktop/*.js; do node --check "$f"; done
      - name: To'liq kun simulyatsiyasi (bot, namoz, reja, tahlil, PDF)
        run: npm test
      - name: Dastur yadrosi (IPC so'rovlari)
        run: |
          node -e "
            const a = require('./core/app').create({ dataDir: '/tmp/isloh', envFile: '/dev/null', log: () => {} });
            (async () => {
              const c = await a.handle('GET', '/api/config');
              if (c.status !== 200 || !c.data.cities.length) throw new Error('config');
              const h = await a.handle('GET', '/api/home');
              if (h.status !== 401) throw new Error('kirishsiz so\'rov rad etilmadi');
              console.log('Yadro ishlayapti, kirishsiz so\'rov rad etildi');
            })().catch(e => { console.error(e); process.exit(1); });"

  build:
    name: Desktop dastur (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist
      - run: test -x dist/linux-unpacked/isloh && du -sh dist/linux-unpacked
