name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Sinov (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Sintaksis tekshiruvi
        run: for f in server/*.js web/*.js; do node --check "$f"; done
      - name: To'liq kun simulyatsiyasi (bot, namoz, reja, tahlil, PDF)
        run: npm test
      - name: Server ishga tushishi
        run: |
          PORT=8099 DATA_DIR=/tmp/isloh node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/api/config > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8099/ | grep -q Isloh
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/home)" = 401
          echo "Server ishlayapti, kirishsiz so'rov rad etildi"
      - if: failure()
        run: cat server.log || true
